[project]
name = "video-helper"
version = "0.1.0"
description = "Download videos and edit them: captions, watermark removal, horizontal/vertical reframing"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.21",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28.1",
    "sqladmin>=0.32.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.15",
    "pylint>=3.3",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: touches a real database, a real ffmpeg or the network"]

[tool.hatch.build.targets.wheel]
packages = ["src", "core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
